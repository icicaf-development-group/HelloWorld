plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'

}

group = 'com.icicaf.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation("org.springframework.boot:spring-boot-starter-validation") // 👈 Validaciones con @Valid y ConstraintViolationException
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
}



tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('runJarWithMemory') {
	dependsOn bootJar // o jar si no usas Spring Boot
	group = "application"
	description = "Genera el JAR y corre la app con límites de memoria personalizados"

	doLast {
		def jarFile = "${buildDir}/libs/${rootProject.name}-0.0.1-SNAPSHOT.jar"

		javaexec {
			mainClass = "-jar"
			args = [jarFile]
			jvmArgs = [
					"-Xms128m",
					"-Xmx256m",
					"-XX:+HeapDumpOnOutOfMemoryError",
					"-XX:HeapDumpPath=logs/dump.hprof"
			]
		}
	}
}
